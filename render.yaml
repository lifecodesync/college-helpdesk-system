services:
  # ========================================================
  # 1. FastAPI Python Backend Service
  # ========================================================
  - type: web
    name: college-helpdesk-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true

  # ========================================================
  # 2. React Vite Frontend Static Site
  # ========================================================
  - type: web
    name: college-helpdesk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # React Router Single Page Application fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://college-helpdesk-backend-sgsu.onrender.com/api/v1
