services:
  # ========================================================
  # 1. FastAPI Python Backend Service
  # ========================================================
  - type: web
    name: college-helpdesk-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        value: https://ndfljoticvoyogezaewg.supabase.co
      - key: SUPABASE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kZmxqb3RpY3ZveW9nZXphZXdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjkwMTcsImV4cCI6MjExMDY0NTAxN30.dNct-daf0T6BFAmrqRQGNhe2_vppU0XdF4B40Y5y5Xc
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kZmxqb3RpY3ZveW9nZXphZXdnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5NTA2OTAxNywiZXhwIjoyMTEwNjQ1MDE3fQ.9WQOoTiziF8irzxqS2Sw4STdURL7ZtHLQB1bypBP8oY

  # ========================================================
  # 2. React Vite Frontend Static Site
  # ========================================================
  - type: web
    name: college-helpdesk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # React Router Single Page Application fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://college-helpdesk-backend-sgsu.onrender.com/api/v1
